<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Dashboard</title>
<style>
  :root {
    --bg: #1b2028;
    --surface: #232a34;
    --surface2: #2a323e;
    --border: #3a4250;
    --text: #e0e6ed;
    --text-muted: #8892a0;
    --green: #1aab4a;
    --green-bg: #0d3320;
    --green-border: #1aab4a;
    --blue: #539bf5;
    --blue-bg: #0d2847;
    --orange: #d29922;
    --orange-bg: #3d2e00;
    --red: #e5534b;
    --red-bg: #3d1418;
    --gray: #6e7681;
    --gray-bg: #2a323e;
    --purple: #a371f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .topbar {
    background: #161b22;
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar h1 {
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .topbar h1 .icon { font-size: 22px; }

  .topbar-actions { display: flex; gap: 10px; align-items: center; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-pending { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange); }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

  .pipeline-list { display: flex; flex-direction: column; gap: 20px; }

  .pipeline-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .pipeline-header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .pipeline-name {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pipeline-meta {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
  }

  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn-primary:hover { background: #4388e0; }
  .btn-success { background: var(--green); border-color: var(--green); color: #fff; }
  .btn-success:hover { background: #158f3e; }
  .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-danger:hover { background: #c9433b; }
  .btn-sm { padding: 4px 12px; font-size: 12px; }

  /* ─── Pipeline Stage Visualization (the green pipeline) ─── */
  .pipeline-stages {
    display: flex;
    align-items: stretch;
    padding: 20px;
    gap: 0;
    overflow-x: auto;
  }

  .stage-wrapper {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .stage-arrow {
    width: 40px;
    height: 2px;
    position: relative;
    display: flex;
    align-items: center;
  }

  .stage-arrow .line {
    width: 100%;
    height: 2px;
    background: var(--border);
  }

  .stage-arrow.succeeded .line { background: var(--green); }
  .stage-arrow.running .line {
    background: linear-gradient(90deg, var(--green), var(--blue));
    animation: pulse 1.5s ease-in-out infinite;
  }

  .stage-arrow .arrow-head {
    position: absolute;
    right: -1px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 8px solid var(--border);
  }

  .stage-arrow.succeeded .arrow-head { border-left-color: var(--green); }
  .stage-arrow.running .arrow-head { border-left-color: var(--blue); }

  .stage-card {
    min-width: 180px;
    max-width: 240px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface2);
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .stage-card.succeeded { border-color: var(--green); }
  .stage-card.running { border-color: var(--blue); animation: glow-blue 2s ease-in-out infinite; }
  .stage-card.failed { border-color: var(--red); }
  .stage-card.pending { border-color: var(--border); }
  .stage-card.skipped { border-color: var(--gray); opacity: 0.5; }

  .stage-card-header {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .stage-card.succeeded .stage-card-header { background: var(--green-bg); }
  .stage-card.running .stage-card-header { background: var(--blue-bg); }
  .stage-card.failed .stage-card-header { background: var(--red-bg); }
  .stage-card.pending .stage-card-header { background: var(--gray-bg); }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-dot.succeeded { background: var(--green); }
  .status-dot.running { background: var(--blue); animation: pulse 1s ease-in-out infinite; }
  .status-dot.failed { background: var(--red); }
  .status-dot.pending { background: var(--gray); }
  .status-dot.skipped { background: var(--gray); }

  .stage-card-body { padding: 10px 14px; }

  .step-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 12px;
    color: var(--text-muted);
  }

  .step-item .step-icon { font-size: 14px; }
  .step-item.succeeded { color: var(--green); }
  .step-item.running { color: var(--blue); }
  .step-item.failed { color: var(--red); }

  .artifact-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    margin: 2px 2px;
    font-weight: 500;
  }

  .artifact-tag.input { background: #1c2d4a; color: var(--blue); border: 1px solid #2d4a7a; }
  .artifact-tag.output { background: #1a2e1a; color: var(--green); border: 1px solid #2a5a2a; }

  .artifacts-row {
    padding: 6px 14px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    border-top: 1px solid var(--border);
  }

  /* ─── Approval Banner ─── */
  .approval-banner {
    margin: 16px 20px;
    padding: 14px 18px;
    background: var(--orange-bg);
    border: 1px solid var(--orange);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .approval-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }

  .approval-info .icon { font-size: 20px; }

  .approval-actions { display: flex; gap: 8px; }

  .approval-message {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ─── No runs state ─── */
  .no-runs {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  .run-info {
    padding: 8px 20px 16px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  @keyframes glow-blue {
    0%, 100% { box-shadow: 0 0 4px rgba(83, 155, 245, 0.2); }
    50% { box-shadow: 0 0 12px rgba(83, 155, 245, 0.4); }
  }

  .refresh-note {
    font-size: 11px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="topbar">
  <h1><span class="icon">⚡</span> Pipeline Dashboard</h1>
  <div class="topbar-actions">
    <span class="refresh-note" id="lastRefresh"></span>
    <span id="approvalBadge"></span>
    <button class="btn btn-sm" onclick="refresh()">↻ Refresh</button>
  </div>
</div>

<div class="container">
  <div class="pipeline-list" id="pipelineList">
    <div class="no-runs">Loading...</div>
  </div>
</div>

<script>
const STATUS_ICONS = {
  succeeded: '✓',
  running: '●',
  failed: '✗',
  pending: '○',
  skipped: '–',
  approved: '✓',
  rejected: '✗',
};

const ACTION_ICONS = {
  build: '🔨',
  test: '🧪',
  deploy: '🚀',
  custom: '⚙️',
  approval: '🔒',
};

let pollTimer = null;

async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  return res.json();
}

async function refresh() {
  try {
    const data = await fetchJSON('/api/pipelines');
    const approvals = await fetchJSON('/api/approvals');
    render(data.definitions, data.runs, approvals);
    document.getElementById('lastRefresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Refresh failed:', e);
  }
}

function render(definitions, runs, approvals) {
  const container = document.getElementById('pipelineList');

  // Show approval badge
  const badge = document.getElementById('approvalBadge');
  if (approvals.length > 0) {
    badge.innerHTML = `<span class="badge badge-pending">🔒 ${approvals.length} pending approval${approvals.length > 1 ? 's' : ''}</span>`;
  } else {
    badge.innerHTML = '';
  }

  if (definitions.length === 0) {
    container.innerHTML = '<div class="no-runs">No pipelines configured</div>';
    return;
  }

  container.innerHTML = definitions.map(def => {
    const defRuns = runs.filter(r => r.definitionId === def.id)
      .sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
    const latestRun = defRuns[0];
    const pendingApprovals = approvals.filter(a =>
      latestRun && a.runId === latestRun.id
    );

    return `
      <div class="pipeline-card">
        <div class="pipeline-header">
          <div>
            <div class="pipeline-name">
              ${latestRun ? statusDot(latestRun.status) : statusDot('pending')}
              ${def.name}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="pipeline-meta">
              ${def.trigger ? `<span>📦 ${def.trigger.repository}:${def.trigger.branch}</span>` : ''}
              <span>${defRuns.length} run${defRuns.length !== 1 ? 's' : ''}</span>
            </div>
            <button class="btn btn-primary btn-sm" onclick="triggerPipeline('${def.id}')">▶ Run</button>
          </div>
        </div>

        ${pendingApprovals.map(a => `
          <div class="approval-banner">
            <div class="approval-info">
              <span class="icon">🔒</span>
              <div>
                <div><strong>Approval Required</strong> — ${a.stageName} / ${a.stepName}</div>
                ${a.message ? `<div class="approval-message">${a.message}</div>` : ''}
              </div>
            </div>
            <div class="approval-actions">
              <button class="btn btn-danger btn-sm" onclick="rejectApproval('${a.runId}','${a.stageName}','${a.stepName}')">✗ Reject</button>
              <button class="btn btn-success btn-sm" onclick="approveApproval('${a.runId}','${a.stageName}','${a.stepName}')">✓ Approve</button>
            </div>
          </div>
        `).join('')}

        ${latestRun ? renderPipelineRun(def, latestRun) : '<div class="no-runs">No runs yet — click Run to start</div>'}
      </div>
    `;
  }).join('');
}

function renderPipelineRun(def, run) {
  const stagesHtml = run.stages.map((stage, i) => {
    const stageDef = def.stages[i];
    const arrow = i > 0 ? `
      <div class="stage-arrow ${run.stages[i-1].status}">
        <div class="line"></div>
        <div class="arrow-head"></div>
      </div>
    ` : '';

    const hasInputArtifacts = stage.inputArtifacts && stage.inputArtifacts.length > 0;
    const hasOutputArtifacts = stage.outputArtifacts && stage.outputArtifacts.length > 0;

    return `
      <div class="stage-wrapper">
        ${arrow}
        <div class="stage-card ${stage.status}">
          <div class="stage-card-header">
            <span>${stage.stageName}</span>
            ${statusDot(stage.status)}
          </div>
          <div class="stage-card-body">
            ${stage.steps.map(step => `
              <div class="step-item ${step.status}">
                <span class="step-icon">${step.action === 'approval' ? (step.approvalStatus === 'approved' ? '✅' : step.approvalStatus === 'rejected' ? '❌' : '🔒') : ACTION_ICONS[step.action] || '⚙️'}</span>
                <span>${step.stepName}</span>
                <span class="step-icon">${STATUS_ICONS[step.status]}</span>
              </div>
            `).join('')}
          </div>
          ${(hasInputArtifacts || hasOutputArtifacts) ? `
            <div class="artifacts-row">
              ${(stage.inputArtifacts || []).map(a => `<span class="artifact-tag input">⬇ ${a.name}</span>`).join('')}
              ${(stage.outputArtifacts || []).map(a => `<span class="artifact-tag output">⬆ ${a.name}</span>`).join('')}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');

  const duration = run.completedAt
    ? formatDuration(new Date(run.startedAt), new Date(run.completedAt))
    : 'In progress...';

  return `
    <div class="run-info">
      <span>Run: ${run.id}</span>
      <span>Commit: ${run.commitRef}</span>
      <span>Started: ${new Date(run.startedAt).toLocaleString()}</span>
      <span>Duration: ${duration}</span>
    </div>
    <div class="pipeline-stages">${stagesHtml}</div>
  `;
}

function statusDot(status) {
  return `<span class="status-dot ${status}"></span>`;
}

function formatDuration(start, end) {
  const ms = end - start;
  if (ms < 1000) return ms + 'ms';
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
}

async function triggerPipeline(id) {
  await fetchJSON(`/api/pipelines/${id}/run`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ commitRef: 'abc' + Math.random().toString(36).slice(2, 8) }),
  });
  setTimeout(refresh, 200);
}

async function approveApproval(runId, stageName, stepName) {
  await fetchJSON('/api/approvals/approve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ runId, stageName, stepName, approvedBy: 'UI Operator' }),
  });
  setTimeout(refresh, 300);
}

async function rejectApproval(runId, stageName, stepName) {
  await fetchJSON('/api/approvals/reject', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ runId, stageName, stepName, rejectedBy: 'UI Operator' }),
  });
  setTimeout(refresh, 300);
}

// Auto-refresh every 2 seconds
refresh();
pollTimer = setInterval(refresh, 2000);
</script>
</body>
</html>
