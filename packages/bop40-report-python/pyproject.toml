[project]
name = "bop40-report"
version = "1.0.0"
description = "BOP 40 Excel report generator for 5 geos — Balance Sheet, P&L, Equity, Assets, Liabilities"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
bop40-report = "bop40_report.cli:main"
